<div class="row mb-3">
    <div class="col-md-4">
        <div class="form-group m-0">
            <label>
                {{'common.select-dao'| translate}}
                <i class="fa fa-question-circle-o ml-1 info-yellow"
                   container="body" placement="right" triggers="mouseenter:mouseleave"
                   ngbPopover="{{'daos.add-team-members.popovers.select-dao'| translate}}">
                </i>
            </label>
            <select name="type" class="form-control" [(ngModel)]="currentDao"
                    (change)="changeDao(currentDao)" required>
                <option *ngFor='let dao of daosList | async' [value]="dao?.aliasName">
                    {{getDaoName(dao?.aliasName)}}
                </option>
            </select>
        </div>
    </div>
    <div class="col-md-4">
        <div class="form-group m-0">
            <label>
                {{'common.select-team'| translate}}
                <i class="fa fa-question-circle-o ml-1 info-yellow"
                   container="body" placement="right" triggers="mouseenter:mouseleave"
                   ngbPopover="{{'daos.add-team-members.popovers.select-team'| translate}}">
                </i>
            </label>
            <select name="type" class="form-control" [(ngModel)]="currentTeam"
                    (change)="changeTeam(currentTeam)" required>
                <option *ngFor='let team of teamsList' [value]="team?.aliasName">
                    {{team?.aliasName.split('TN').pop().split('TT').shift()}}
                </option>
            </select>
        </div>
    </div>
</div>
