<form class="form inner-form mt-5 create-dao-form" #f="ngForm" novalidate>
    <div class="form-body">
        <div class="row">
            <div class="col-md-4">
                <div class="form-group m-0">
                    <label>{{'daos.create-dao.labels.dao-name' | translate}}
                        <i class="fa fa-question-circle-o ml-1 info-yellow"
                           container="body" placement="right" triggers="mouseenter:mouseleave"
                           ngbPopover="{{'daos.create-dao.popovers.dao-name'| translate}}">
                        </i>
                    </label>
                    <div class="input-group m-0 row">
                        <div class="col-12 pl-0">
                            <input type="text" class="form-control" name="name"
                                   #name="ngModel"
                                   [(ngModel)]="createDaoForm.name"
                                   placeholder="{{'daos.create-dao.placeholders.dao-name-placeholder' | translate}}"
                                   required>
                        </div>
                    </div>
                    <div *ngIf="name?.invalid && (name?.dirty || name?.touched)"
                         class="input-error">
                        <div *ngIf="name?.errors.required">
                            {{'daos.create-dao.validation.name-is-required' | translate}}
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group m-0">
                    <label>{{'daos.create-dao.labels.dao-prefix' | translate}}
                        <i class="fa fa-question-circle-o ml-1 info-yellow"
                           container="body" placement="right" triggers="mouseenter:mouseleave"
                           ngbPopover="{{'daos.create-dao.popovers.dao-prefix'| translate}}">
                        </i>
                    </label>
                    <div class="input-group m-0 row">
                        <div class="col-12 pl-0">
                            <input type="text" class="form-control" name="prefix"
                                   #prefix="ngModel"
                                   [(ngModel)]="createDaoForm.prefix"
                                   placeholder="{{'daos.create-dao.placeholders.dao-prefix-placeholder' | translate}}"
                                   required>
                        </div>
                    </div>
                    <div *ngIf="prefix?.invalid && (prefix?.dirty || prefix?.touched)"
                         class="input-error">
                        <div *ngIf="prefix?.errors.required">
                            {{'daos.create-dao.validation.prefix-is-required' | translate}}
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-group m-0">
                    <label>{{'common.quantity-label' | translate}}
                        <i class="fa fa-question-circle-o ml-1 info-yellow"
                           container="body" placement="right" triggers="mouseenter:mouseleave"
                           ngbPopover="{{'daos.create-dao.popovers.quantity'| translate}}">
                        </i>
                    </label>
                    <div class="input-group m-0 row">
                        <div class="col-10 pl-0">
                            <input type="number"
                                   class="pl-0 mb-0 pt-0 pb-0 form-control"
                                   name="quantity"
                                   #quantity="ngModel"
                                   [(ngModel)]="createDaoForm.quantity"
                                   placeholder="{{'common.quantity-label' | translate}}"
                                   required>
                        </div>
                        <div class="col-2 text-right pl-0">
                            <span class="input-group-text text-right">{{'daos.create-dao.dao-quantity-unit' | translate}}</span>
                        </div>
                    </div>
                    <div *ngIf="quantity?.invalid && (quantity?.dirty || quantity?.touched)"
                         class="input-error">
                        <div *ngIf="quantity?.errors.required">
                            {{'common.quantity-required'| translate}}
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="form-group m-0">
                    <label>{{'common.description-label' | translate}}
                        <i class="fa fa-question-circle-o ml-1 info-yellow"
                           container="body" placement="right" triggers="mouseenter:mouseleave"
                           ngbPopover="{{'daos.create-dao.popovers.description'| translate}}">
                        </i>
                    </label>
                    <div class="input-group m-0">
                                                        <textarea rows="4" class="form-control" name="description"
                                                                  #description="ngModel"
                                                                  [(ngModel)]="createDaoForm.description"
                                                                  placeholder="{{'daos.create-dao.placeholders.dao-description-placeholder' | translate}}"
                                                                  required></textarea>
                    </div>
                    <div *ngIf="description?.invalid && (description?.dirty || description?.touched)"
                         class="input-error">
                        <div *ngIf="description?.errors.required">
                            {{'common.description-required'| translate }}
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4"></div>
            <div class="col-md-4">
                <div class="input-group m-0 row">
                    <div class="col-8 pl-0">
                        <input type="hidden"
                               class="pl-0 mb-0 pt-0 pb-0 form-control"
                               name="decimals" #decimals="ngModel"
                               [(ngModel)]="createDaoForm.decimals"
                               placeholder="{{'daos.create-dao.labels.dao-decimals-label' | translate}}"
                               required minValue="1">
                    </div>
                </div>
            </div>
        </div>
        <button type="button" class="btn btn-gradient mr-1 mb-0 mt-4 float-right" (click)="createDAO()"
                [disabled]="f.invalid">
            {{'common.next-btn'| translate}} <i class="fa fa-chevron-right"></i>
        </button>
    </div>
</form>
